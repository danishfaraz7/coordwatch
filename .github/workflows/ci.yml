name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONUTF8: "0"          # emulate the legacy default encodings so a missing encoding="utf-8" is caught
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (the browser download for X is not needed for tests)
        run: python -m pip install requests Pillow telethon beautifulsoup4 yt-dlp ddgs reportlab pytest
      - name: Run the tests
        run: python -m pytest -q
      - name: CLI demo run
        run: python -m coordwatch run --topic "Acme Bank" --since 2026-10-01 --until 2026-10-14 --source demo --out ci_out

  ui:
    name: Browser UI tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install requests Pillow telethon beautifulsoup4 yt-dlp ddgs reportlab pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run the UI tests (layout at 12 screen sizes, menu, dates, views)
        run: python -m pytest tests/test_ui_e2e.py -q
